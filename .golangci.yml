version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - staticcheck
    - errcheck
    - gosec
    - govet
  exclusions:
    generated: strict
    presets: []
    rules:
      # Tests build forged cookies, fixture credentials, local listeners and
      # node subprocesses on purpose; gosec still covers all non-test code.
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
